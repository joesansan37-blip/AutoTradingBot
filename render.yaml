services:
  - type: web
    name: autotradingbot
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: EXECUTION_MODE
        value: paper
      - key: DATA_EXCHANGE
        value: kraken
      - key: TRADING_SYMBOL
        value: SOL/USDT
      - key: TIMEFRAME
        value: 15m
      - key: PAPER_STARTING_BALANCE_USDT
        value: "500"
      - key: PAPER_STATE_FILE
        value: paper_account.json
      - key: ORDER_MARGIN_USDT
        value: "25"
      - key: LEVERAGE
        value: "2"
      - key: STOP_LOSS_PCT
        value: "2"
      - key: TAKE_PROFIT_PCT
        value: "4"
      - key: PAPER_FEE_RATE
        value: "0.0006"
      - key: MAX_DAILY_LOSS_USDT
        value: "25"
      - key: SCAN_SECONDS
        value: "15"
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
